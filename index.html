<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#0b2f35"><title>RIVA — Real Estate Assistant</title>
<style>
:root{--cream:#f4e7b8;--blue:#0b2f35;--ink:#102a2d;--muted:#687679;--line:#d8dcd8}*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;font-family:Inter,system-ui,-apple-system,"Segoe UI",sans-serif;color:var(--ink)}body{background:radial-gradient(circle at 12% 10%,#fff8d8 0 18%,transparent 40%),radial-gradient(circle at 90% 90%,#dce8df 0 12%,transparent 40%),var(--cream);display:grid;place-items:center;padding:24px}.app{width:min(820px,100%);height:min(760px,calc(100vh - 48px));min-height:520px;background:#ffffff78;backdrop-filter:blur(24px);border:1px solid #ffffffc9;border-radius:26px;box-shadow:0 24px 70px #0b2f352e;overflow:hidden;display:grid;grid-template-rows:72px minmax(0,1fr) auto}.head{display:flex;align-items:center;justify-content:space-between;padding:0 22px;border-bottom:1px solid var(--line);background:#ffffff45}.brand{display:flex;align-items:center;gap:11px}.logo{width:38px;height:38px;border-radius:12px;background:var(--blue);color:#f5e7b6;display:grid;place-items:center;font-weight:800}.brand b{font-size:16px;letter-spacing:1.6px}.brand small{display:block;color:var(--muted);font-size:11px;margin-top:2px}.head-right{display:flex;align-items:center;gap:15px;color:var(--muted);font-size:11px}.online{width:7px;height:7px;border-radius:50%;background:#789654;display:inline-block;margin-right:6px}.clear{border:0;background:none;color:var(--muted);cursor:pointer;font:inherit}.clear:hover{color:var(--blue)}#chat{min-height:0;overflow-y:auto;overflow-x:hidden;padding:26px 24px 18px;scroll-behavior:smooth;overscroll-behavior:contain}.msg{display:flex;gap:9px;margin-bottom:17px}.msg.user{justify-content:flex-end}.avatar{width:28px;height:28px;border-radius:9px;background:var(--blue);color:#f5e7b6;display:grid;place-items:center;font-size:10px;font-weight:800;flex:none}.bubble{max-width:74%;padding:12px 15px;border-radius:17px;font-size:14px;line-height:1.58;white-space:pre-wrap;overflow-wrap:anywhere}.bot .bubble{background:#ffffffe8;border:1px solid #ffffffdb;border-top-left-radius:6px}.user .bubble{background:var(--blue);color:#fff;border-bottom-right-radius:6px}.typing{display:flex;gap:4px;padding:14px 16px}.typing i{width:5px;height:5px;border-radius:50%;background:#758789;animation:b .8s infinite alternate}@keyframes b{to{opacity:.25;transform:translateY(-2px)}}.composer{border-top:1px solid var(--line);padding:11px 18px 15px;background:#ffffff42}.suggestions{display:flex;gap:7px;overflow-x:auto;scrollbar-width:none;padding:0 2px 10px}.suggestions::-webkit-scrollbar{display:none}.suggestion{white-space:nowrap;border:1px solid #0b2f3520;background:#ffffff9e;color:var(--blue);border-radius:999px;padding:7px 11px;font-size:11px;cursor:pointer}.suggestion:hover{background:#fff}.row{display:flex;gap:8px}.input{flex:1;min-width:0;border:1px solid #0b2f3526;background:#ffffffe8;border-radius:15px;padding:13px 15px;outline:0;font:inherit;font-size:14px}.input:focus{border-color:#0b2f3566;box-shadow:0 0 0 4px #0b2f350d}.send{border:0;border-radius:15px;background:var(--blue);color:white;padding:0 18px;font-weight:700;cursor:pointer}.note{text-align:center;color:#7a8586;font-size:9px;margin-top:7px}@media(max-width:600px){body{padding:0}.app{width:100%;height:100%;min-height:0;border-radius:0}.head{padding:0 15px}.head-right span{display:none}#chat{padding:20px 14px}.bubble{max-width:85%}.composer{padding:10px 10px 13px}.send{padding:0 15px}}
</style></head><body>
<div class="app"><header class="head"><div class="brand"><div class="logo">R</div><div><b>RIVA</b><small>Real Estate Assistant</small></div></div><div class="head-right"><span><i class="online"></i>Offline</span><button class="clear" id="clear">Clear</button></div></header>
<section id="chat" aria-live="polite"></section><footer class="composer"><div class="suggestions"><button class="suggestion" data-q="What is ROI in real estate?">ROI</button><button class="suggestion" data-q="What are the costs of buying property in Dubai?">Buying costs</button><button class="suggestion" data-q="Should I rent or buy?">Rent or buy</button><button class="suggestion" data-q="What is off-plan property?">Off-plan</button><button class="suggestion" data-q="Which areas in Dubai are freehold?">Freehold areas</button></div><form class="row" id="form"><input id="input" class="input" autocomplete="off" placeholder="Message RIVA…"><button class="send">Send</button></form><div class="note">General information only — verify financial, legal and regulatory details before acting.</div></footer></div>
<script>
const chat=document.getElementById('chat'),input=document.getElementById('input'),form=document.getElementById('form');
const state={area:null,budget:null,beds:null,type:null,purpose:null};
const facts={
roi:'ROI measures return relative to the amount invested. For rental property, gross rental yield is annual rent ÷ purchase price × 100. Net return is more useful because it also accounts for service charges, maintenance, vacancy and financing.',
freehold:'Freehold generally means ownership of the property interest, while leasehold gives rights for a defined period under a lease. In Dubai, eligibility depends on the specific property and current regulations, so the title and project should be checked.',
offplan:'Off-plan means buying a property before completion. It may offer developer payment plans and early pricing, but involves completion, delivery and market risks. Ready property can be inspected and is generally available for occupation or rental sooner.',
service:'Service charges cover the operation and maintenance of shared areas and facilities. They can include security, cleaning, common-area maintenance and amenities. Always check the current charge for the specific building or community.',
mortgage:'A mortgage is financing secured against a property. Affordability depends on income, existing obligations, down payment, rate, term and lender criteria. Compare total borrowing cost, not just the monthly payment.',
rentbuy:'Renting offers flexibility and lower upfront commitment. Buying can make sense if you plan to stay longer, can comfortably cover the upfront costs and want to build ownership. The better choice depends on your numbers and priorities.',
costs:'Buying property can involve registration or transfer charges, agency fees, mortgage and valuation costs, legal or conveyancing fees, developer or community charges and ongoing service charges. Exact fees depend on the transaction and should be verified before payment.',
areas:'Common Dubai freehold locations include Downtown Dubai, Dubai Marina, Palm Jumeirah, Jumeirah Lakes Towers and Dubai Hills Estate. Confirm ownership eligibility for the specific project before relying on a general area list.',
escrow:'An escrow account holds funds under agreed conditions. In Dubai property transactions, escrow arrangements are especially relevant to certain development projects and provide controls around project funds.',
agent:'A good agent should explain the property, costs, documents and transaction process without pressure. Before working with one, confirm their licence, fees, representation and services.',
appreciation:'Capital appreciation is an increase in property value over time. It can be influenced by location, demand, infrastructure, supply, project quality and wider market conditions. It is not guaranteed.',
dubai:'Dubai has apartments, villas, townhouses, off-plan projects and ready properties. A useful comparison considers location, price, service charges, rental demand, supply, building or developer quality and your intended holding period.'};
const aliases={roi:['roi','return on investment','rental yield','yield','returns'],freehold:['freehold','leasehold','ownership'],offplan:['off plan','off-plan','offplan','ready property','ready home','completed property'],service:['service charge','service charges','maintenance fee','maintenance fees'],mortgage:['mortgage','home loan','housing loan','mortgage loan'],rentbuy:['rent or buy','rent vs buy','buy or rent','renting or buying'],costs:['buying cost','buying costs','purchase cost','purchase costs','buying fee','buying fees','transaction cost','transaction costs','cost of buying'],areas:['freehold areas','freehold area','where to buy','best areas','area to buy'],escrow:['escrow'],agent:['agent','broker','brokerage','real estate agent'],appreciation:['appreciation','capital appreciation','property value increase'],dubai:['dubai real estate','dubai property','real estate in dubai','property market','housing market']};
function norm(s){return s.toLowerCase().normalize('NFKD').replace(/[^a-z0-9\s-]/g,' ').replace(/\s+/g,' ').trim()}
function distance(a,b){if(Math.abs(a.length-b.length)>2)return 99;let prev=Array.from({length:b.length+1},(_,i)=>i);for(let i=1;i<=a.length;i++){let cur=[i];for(let j=1;j<=b.length;j++)cur[j]=Math.min(cur[j-1]+1,prev[j]+1,prev[j-1]+(a[i-1]===b[j-1]?0:1));prev=cur}return prev[b.length]}
function matches(n,k){if(n.includes(k))return true;let words=n.split(' '),parts=k.split(' ');if(parts.length>1)return false;return k.length>=4&&words.some(w=>distance(w,k)<=1)}
function detect(q){let n=norm(q),best=null,score=0;for(const [name,list] of Object.entries(aliases)){let s=0;for(const k of list)if(matches(n,norm(k)))s+=k.includes(' ')?4:2;if(s>score){score=s;best=name}}return best}
function extract(q){let n=norm(q);let money=n.match(/(?:aed|dhs?|inr|usd|\$)\s*([\d,.]+)\s*(k|m|million|thousand)?|([\d,.]+)\s*(k|m|million|thousand)?\s*(?:aed|dhs?|inr|usd)/);if(money)state.budget=(money[1]||money[3])+((money[2]||money[4])||'');let bed=n.match(/studio|[1-9]\s*(?:bed|bedroom|bhk|br)/);if(bed)state.beds=bed[0];const areas=['dubai marina','downtown dubai','palm jumeirah','jlt','jumeirah lakes towers','dubai hills','business bay','jvc','arabian ranches','dubai creek harbour','dubai silicon oasis','damac hills','emirates hills'];const found=areas.find(x=>n.includes(x));if(found)state.area=found;if(/\b(buy|buying|purchase|for sale)\b/.test(n))state.purpose='buy';if(/\b(rent|renting|rental)\b/.test(n))state.purpose='rent';if(/\b(invest|investment|investing|roi|yield)\b/.test(n))state.purpose='investment';if(/villa/.test(n))state.type='villa';else if(/townhouse|townhome/.test(n))state.type='townhouse';else if(/apartment|flat|studio|bhk|bedroom/.test(n))state.type='apartment'}
function searchReply(){let known=[state.purpose,state.type,state.beds,state.area,state.budget].filter(Boolean);if(known.length<2)return 'Sure. Tell me whatever you know: buy or rent, area, budget, property type, bedrooms, and whether it is for living or investment.';let missing=[];if(!state.purpose)missing.push('buy or rent');if(!state.area)missing.push('area');if(!state.budget)missing.push('budget');if(!state.type)missing.push('property type');if(!state.beds)missing.push('bedrooms');return 'Got it. I have: '+known.join(' · ')+'. '+(missing.length?'The next useful detail is '+missing.slice(0,2).join(' or ')+'.':'That gives us a solid starting point.')}
function conversational(n){if(/^(hi|hello|hey|hii|heyy|yo|good morning|good afternoon|good evening)(\s|$)/.test(n)){if(/how are you|how r u|how r you|howre you|hows it going|how is it going/.test(n))return 'Hi. I’m doing well, thanks. How are you?';return 'Hi. How can I help?'}if(/^(how are you|how r u|how r you|howre you|hows it going|how is it going)$/.test(n))return 'I’m doing well, thanks. What can I help you with?';if(/^(im good|i am good|i'm good|im fine|i am fine|i'm fine|doing good|doing well|im great|i am great)$/.test(n))return 'Good to hear. What would you like to look at?';if(/^(thanks|thank you|thx|ty)$/.test(n))return 'You’re welcome. What would you like to look at next?';if(/^(who are you|what are you|what is riva)$/.test(n))return 'I’m RIVA, a real-estate assistant. I can explain property concepts, compare options and help structure a property search.';if(/^(bye|goodbye|see you|talk later)$/.test(n))return 'Sure. I’ll be here when you need me.';return null}
function answer(q){let n=norm(q),small=conversational(n);if(small)return small;extract(q);let i=detect(q);if(state.area||state.budget||state.beds||/\b(find|looking for|need|want)\b.*\b(property|apartment|villa|home|house)\b/.test(n))return searchReply();if(i&&facts[i])return facts[i];if(/\b(price|cost|how much|expensive|cheap|afford)\b/.test(n))return 'I can help with pricing and affordability. Tell me the location, property type, whether you want to buy or rent, and your approximate budget.';if(/\b(invest|investment|investing)\b/.test(n))return 'For an investment, the useful numbers are purchase price, achievable rent, service charges, financing, vacancy and your expected holding period.';if(/\brent\b/.test(n))return 'Are you asking about renting, rental income, or whether renting is better than buying? Give me a little context and I’ll help.';if(/\b(buy|purchase)\b/.test(n))return 'I can help with that. What are you looking to buy, where, and roughly what budget are you considering?';if(/\b(real estate|property|apartment|villa|house|mortgage|tenant|landlord)\b/.test(n))return 'Yes, I can help with that. Tell me what you’re trying to understand or decide, and include the location if it matters.';if(n.length<4)return 'Could you give me a little more context?';return 'I’m not completely sure what you mean yet. Try rephrasing it or add the property, location or goal, and I’ll work it out from there.'}
function add(text,who='bot'){const r=document.createElement('div');r.className='msg '+who;r.innerHTML=(who==='bot'?'<div class="avatar">R</div>':'')+'<div class="bubble"></div>';r.querySelector('.bubble').textContent=text;chat.appendChild(r);requestAnimationFrame(()=>chat.scrollTop=chat.scrollHeight)}
function typing(){const r=document.createElement('div');r.id='typing';r.className='msg bot';r.innerHTML='<div class="avatar">R</div><div class="bubble typing"><i></i><i></i><i></i></div>';chat.appendChild(r);chat.scrollTop=chat.scrollHeight}
function send(q){q=q.trim();if(!q)return;add(q,'user');input.value='';typing();setTimeout(()=>{document.getElementById('typing')?.remove();add(answer(q))},220+Math.random()*280)}
function reset(){Object.keys(state).forEach(k=>state[k]=null);chat.innerHTML='';add('Hello. I’m RIVA, the real-estate assistant. How can I help?')}
form.addEventListener('submit',e=>{e.preventDefault();send(input.value)});document.querySelectorAll('.suggestion').forEach(b=>b.addEventListener('click',()=>send(b.dataset.q)));document.getElementById('clear').addEventListener('click',()=>{reset();input.focus()});reset();
</script></body></html>
