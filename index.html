<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#0b2f35">
<title>RIVA — Real Estate Assistant</title>
<style>
:root{--cream:#f4e7b8;--blue:#0b2f35;--ink:#102a2d;--muted:#687679;--line:#d8dcd8}
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;font-family:Inter,system-ui,-apple-system,"Segoe UI",sans-serif;color:var(--ink)}
body{background:radial-gradient(circle at 12% 10%,#fff8d8 0 18%,transparent 40%),radial-gradient(circle at 90% 90%,#dce8df 0 12%,transparent 40%),var(--cream);display:grid;place-items:center;padding:24px}
.app{width:min(820px,100%);height:min(760px,calc(100vh - 48px));min-height:520px;background:#ffffff78;backdrop-filter:blur(24px);border:1px solid #ffffffc9;border-radius:26px;box-shadow:0 24px 70px #0b2f352e;overflow:hidden;display:grid;grid-template-rows:72px minmax(0,1fr) auto}
.head{display:flex;align-items:center;justify-content:space-between;padding:0 22px;border-bottom:1px solid var(--line);background:#ffffff45}.brand{display:flex;align-items:center;gap:11px}.logo{width:38px;height:38px;border-radius:12px;background:var(--blue);color:#f5e7b6;display:grid;place-items:center;font-weight:800}.brand b{font-size:16px;letter-spacing:1.6px}.brand small{display:block;color:var(--muted);font-size:11px;margin-top:2px}.head-right{display:flex;align-items:center;gap:15px;color:var(--muted);font-size:11px}.online{width:7px;height:7px;border-radius:50%;background:#789654;display:inline-block;margin-right:6px}.clear{border:0;background:none;color:var(--muted);cursor:pointer;font:inherit}.clear:hover{color:var(--blue)}
#chat{min-height:0;overflow-y:auto;overflow-x:hidden;padding:26px 24px 18px;scroll-behavior:smooth;overscroll-behavior:contain}.msg{display:flex;gap:9px;margin-bottom:17px}.msg.user{justify-content:flex-end}.avatar{width:28px;height:28px;border-radius:9px;background:var(--blue);color:#f5e7b6;display:grid;place-items:center;font-size:10px;font-weight:800;flex:none}.bubble{max-width:74%;padding:12px 15px;border-radius:17px;font-size:14px;line-height:1.58;white-space:pre-wrap;overflow-wrap:anywhere}.bot .bubble{background:#ffffffe8;border:1px solid #ffffffdb;border-top-left-radius:6px}.user .bubble{background:var(--blue);color:#fff;border-bottom-right-radius:6px}
.typing{display:flex;gap:4px;padding:14px 16px}.typing i{width:5px;height:5px;border-radius:50%;background:#758789;animation:b .8s infinite alternate}@keyframes b{to{opacity:.25;transform:translateY(-2px)}}.composer{border-top:1px solid var(--line);padding:11px 18px 15px;background:#ffffff42}.suggestions{display:flex;gap:7px;overflow-x:auto;scrollbar-width:none;padding:0 2px 10px}.suggestions::-webkit-scrollbar{display:none}.suggestion{white-space:nowrap;border:1px solid #0b2f3520;background:#ffffff9e;color:var(--blue);border-radius:999px;padding:7px 11px;font-size:11px;cursor:pointer}.suggestion:hover{background:#fff}.row{display:flex;gap:8px}.input{flex:1;min-width:0;border:1px solid #0b2f3526;background:#ffffffe8;border-radius:15px;padding:13px 15px;outline:0;font:inherit;font-size:14px}.input:focus{border-color:#0b2f3566;box-shadow:0 0 0 4px #0b2f350d}.send{border:0;border-radius:15px;background:var(--blue);color:white;padding:0 18px;font-weight:700;cursor:pointer}.note{text-align:center;color:#7a8586;font-size:9px;margin-top:7px}
@media(max-width:600px){body{padding:0}.app{width:100%;height:100%;min-height:0;border-radius:0}.head{padding:0 15px}.head-right span{display:none}#chat{padding:20px 14px}.bubble{max-width:85%}.composer{padding:10px 10px 13px}.send{padding:0 15px}}
</style>
</head>
<body>
<div class="app">
<header class="head"><div class="brand"><div class="logo">R</div><div><b>RIVA</b><small>Real Estate Assistant</small></div></div><div class="head-right"><span><i class="online"></i>Offline</span><button class="clear" id="clear">Clear</button></div></header>
<section id="chat" aria-live="polite"></section>
<footer class="composer"><div class="suggestions"><button class="suggestion" data-q="roi">ROI</button><button class="suggestion" data-q="buying costs">Buying costs</button><button class="suggestion" data-q="rent or buy">Rent or buy</button><button class="suggestion" data-q="off plan">Off-plan</button><button class="suggestion" data-q="freehold areas">Freehold areas</button></div><form class="row" id="form"><input id="input" class="input" autocomplete="off" placeholder="Message RIVA…"><button class="send">Send</button></form><div class="note">General information only — verify financial, legal and regulatory details before acting.</div></footer>
</div>
<script>
const chat=document.getElementById('chat'),input=document.getElementById('input'),form=document.getElementById('form');
const state={area:null,budget:null,beds:null,type:null,purpose:null,stage:null,topic:null};
const facts={
roi:'ROI means return on investment. A simple rental yield is annual rent ÷ purchase price × 100. Net return also considers service charges, maintenance, vacancy, financing and other costs.',
freehold:'Freehold generally means ownership of the property interest, while leasehold gives rights for a defined period under a lease. In Dubai, eligibility depends on the specific property and current rules.',
offplan:'Off-plan means buying a property before completion. It can offer developer payment plans and earlier pricing, but consider delivery, developer, project and market risks.',
ready:'A ready property is completed and available to inspect, occupy or rent. You can usually assess the actual building and location before committing.',
service:'Service charges cover shared-area operation and maintenance, such as security, cleaning, common areas and facilities. Check the current charge for the exact building or community.',
mortgage:'A mortgage is property financing secured against the property. Lenders consider income, existing commitments, down payment, rate, term and their own criteria.',
rentbuy:'Renting usually gives more flexibility and less upfront capital. Buying can make sense when you expect to stay longer and can comfortably cover the upfront costs.',
costs:'Buying property can involve transfer or registration charges, agency fees, mortgage and valuation costs, legal or conveyancing fees, developer or community charges and ongoing service charges.',
areas:'Common Dubai freehold locations include Downtown Dubai, Dubai Marina, Palm Jumeirah, JLT and Dubai Hills Estate. Confirm eligibility for the exact property.',
escrow:'An escrow account holds project funds under controlled conditions. Escrow arrangements are particularly relevant to certain Dubai development projects.',
agent:'A good agent should explain the property, costs, documents and process clearly. Check their licence, fees, representation and services.',
appreciation:'Capital appreciation is an increase in property value over time. It can be affected by location, demand, infrastructure, supply, project quality and wider market conditions.',
dubai:'Dubai has apartments, villas, townhouses, off-plan projects and ready properties. Compare location, price, service charges, rental demand, supply, quality and your intended holding period.',
downpayment:'A down payment is the portion of the purchase price paid upfront rather than financed through a mortgage. The required amount depends on the buyer, property and lender rules.',
tenancy:'A tenancy agreement sets out the terms between landlord and tenant, including rent, duration, responsibilities and other conditions.',
valuation:'A property valuation is an estimate of market value, often prepared for financing or decision-making. It is not a guaranteed sale price.',
caprate:'A cap rate is generally net operating income divided by property value. It is useful for comparing income-producing properties.',
area:'Choosing an area depends on budget, commute, lifestyle, rental demand, schools, transport, amenities, supply and the property type you want.'};
const aliases={roi:['roi','return on investment','rental yield','yield','return','returns','profit','profitability'],freehold:['freehold','leasehold','ownership'],offplan:['off plan','off-plan','offplan','under construction'],ready:['ready property','ready home','completed property','ready'],service:['service charge','service charges','maintenance fee','maintenance fees','building fee'],mortgage:['mortgage','home loan','housing loan','mortgage loan','finance','financing'],rentbuy:['rent or buy','rent vs buy','buy or rent','renting or buying'],costs:['buying cost','buying costs','purchase cost','purchase costs','buying fee','buying fees','transaction cost','transaction costs','cost of buying','fees'],areas:['freehold areas','freehold area','where to buy','best areas','area to buy','good areas'],escrow:['escrow'],agent:['agent','broker','brokerage','real estate agent','realtor'],appreciation:['appreciation','capital appreciation','property value increase','price growth'],dubai:['dubai real estate','dubai property','real estate in dubai','property market','housing market'],downpayment:['down payment','downpayment','deposit','upfront payment'],tenancy:['tenancy','tenancy agreement','lease agreement','rental contract'],valuation:['valuation','property valuation','market value'],caprate:['cap rate','capitalization rate'],area:['area','location','neighborhood','neighbourhood','community']};
function norm(s){return s.toLowerCase().normalize('NFKD').replace(/[^a-z0-9\s-]/g,' ').replace(/\s+/g,' ').trim()}
function distance(a,b){if(Math.abs(a.length-b.length)>2)return 99;let p=Array.from({length:b.length+1},(_,i)=>i);for(let i=1;i<=a.length;i++){let c=[i];for(let j=1;j<=b.length;j++)c[j]=Math.min(c[j-1]+1,p[j]+1,p[j-1]+(a[i-1]===b[j-1]?0:1));p=c}return p[b.length]}
function wordMatch(n,k){if(n.includes(k))return true;if(k.length<4||k.includes(' '))return false;return n.split(' ').some(w=>distance(w,k)<=1)}
function detect(n){let best=null,score=0;for(const [name,list] of Object.entries(aliases)){let s=0;for(const raw of list){let k=norm(raw);if(wordMatch(n,k))s+=k.includes(' ')?5:2}if(s>score){score=s;best=name}}return best}
function extract(q){let n=norm(q);let money=n.match(/(?:aed|dhs?|dirhams?)\s*([\d,.]+)\s*(k|m|million|thousand|billion)?|([\d,.]+)\s*(k|m|million|thousand|billion)?\s*(?:aed|dhs?|dirhams?)/);if(money)state.budget=(money[1]||money[3])+((money[2]||money[4])||'');let bed=n.match(/studio|[1-9]\s*(?:bed|bedroom|bhk|br)/);if(bed)state.beds=bed[0];const areas={'dubai marina':'Dubai Marina','marina':'Dubai Marina','downtown dubai':'Downtown Dubai','downtown':'Downtown Dubai','palm jumeirah':'Palm Jumeirah','palm':'Palm Jumeirah','jlt':'JLT','jumeirah lakes towers':'JLT','dubai hills':'Dubai Hills Estate','dubai hills estate':'Dubai Hills Estate','business bay':'Business Bay','jvc':'JVC','jumeirah village circle':'JVC','arabian ranches':'Arabian Ranches','dubai creek harbour':'Dubai Creek Harbour','creek harbour':'Dubai Creek Harbour','dubai silicon oasis':'Dubai Silicon Oasis','silicon oasis':'Dubai Silicon Oasis','damac hills':'Damac Hills','emirates hills':'Emirates Hills','deira':'Deira','bur dubai':'Bur Dubai','barsha':'Al Barsha','al barsha':'Al Barsha','meydan':'Meydan'};for(const [k,v] of Object.entries(areas))if(n.includes(k)){state.area=v;break}if(/\b(buy|buying|purchase|purchasing|sale|for sale|own|ownership)\b/.test(n))state.purpose='buy';if(/\b(rent|renting|rental|lease|leasing)\b/.test(n))state.purpose='rent';if(/\b(invest|investment|investing|roi|yield|income property)\b/.test(n))state.purpose='investment';if(/villa|vila/.test(n))state.type='villa';else if(/townhouse|townhome|town house/.test(n))state.type='townhouse';else if(/apartment|aprtment|flat|studio|bhk|bedroom|apt/.test(n))state.type='apartment';if(/off.?plan|under construction/.test(n))state.stage='off-plan';else if(/ready|completed/.test(n))state.stage='ready'}
function hasAny(n,arr){return arr.some(x=>wordMatch(n,x))}
function searchReply(){let pieces=[];if(state.purpose)pieces.push(state.purpose);if(state.type)pieces.push(state.type);if(state.beds)pieces.push(state.beds);if(state.area)pieces.push(state.area);if(state.budget)pieces.push('AED '+state.budget);if(state.stage)pieces.push(state.stage);if(pieces.length<2)return 'Sure. What are you looking for?';let missing=[];if(!state.purpose)missing.push('buy or rent');if(!state.area)missing.push('area');if(!state.budget)missing.push('budget');if(!state.type)missing.push('property type');if(!state.beds)missing.push('bedrooms');return 'Got it — '+pieces.join(' · ')+(missing.length?'. '+missing.slice(0,2).join(' or ')+'?':'. What would you like to know next?')}
function conversational(n){
if(/^(hi|hello|hey|hii|heyy|yo|sup|hiya)$/.test(n))return 'Hi. What can I help you with?';
if(/^(what are you doing|what you doing|whatcha doing|watcha doin|what r u doing|whatre you doing|wyd|u doing|you doing)$/.test(n))return 'Just here. What are you looking at?';
if(/^(how are you|how r u|howre you|hows it going|how is it going)$/.test(n))return 'I’m doing well, thanks. What can I help you with?';
if(/^(im good|i am good|i m good|im fine|i am fine|doing good|doing well|im great|i am great|good|fine|not bad|pretty good)$/.test(n))return 'Good to hear. What are you looking for?';
if(/^(thanks|thank you|thank u|thx|ty|cheers|tq)$/.test(n))return 'You’re welcome.';
if(/^(who are you|what are you|what is riva|riva)$/.test(n))return 'I’m RIVA, a real-estate assistant.';
if(/^(bye|goodbye|see you|talk later|cya|gtg)$/.test(n))return 'See you.';
if(/^(ok|okay|alright|got it|cool|nice|great|perfect)$/.test(n))return 'Alright.';
if(/^(lol|lmao|haha|hehe)$/.test(n))return 'Haha.';
return null}
function answer(q){let n=norm(q),c=conversational(n);if(c)return c;extract(q);let i=detect(n);if(/^(yes|yeah|yep|yup|no|nope|nah|sure)$/.test(n))return n.startsWith('y')?'Alright.':'Okay.';if(state.area||state.budget||state.beds||state.type||/\b(find|looking|need|want|search|recommend|show)\b/.test(n)&&/\b(property|apartment|villa|home|house|flat|place|bed|bhk|marina|dubai)\b/.test(n))return searchReply();if(i&&facts[i])return facts[i];if(/\b(price|cost|how much|expensive|cheap|afford|budget)\b/.test(n))return 'Tell me the property, area or budget and I’ll help with the numbers.';if(/\b(invest|investment|investing)\b/.test(n))return 'For an investment, look at purchase price, rent, service charges, financing, vacancy, appreciation and holding period.';if(/\brent\b/.test(n))return 'Sure. Tell me the area, budget or property type.';if(/\b(buy|purchase|buying)\b/.test(n))return 'Sure. Tell me the area, budget, property type or bedrooms.';if(/\b(real estate|property|apartment|villa|house|home|townhouse|mortgage|tenant|landlord|developer|broker|agent)\b/.test(n))return 'Sure. What do you want to know?';return 'What are you looking for?'}
function addMessage(text,who){let wrap=document.createElement('div');wrap.className='msg '+who;wrap.innerHTML=who==='bot'?'<div class="avatar">R</div><div class="bubble"></div>':'<div class="bubble"></div>';wrap.querySelector('.bubble').textContent=text;chat.appendChild(wrap);chat.scrollTop=chat.scrollHeight}
function send(q){q=q.trim();if(!q)return;addMessage(q,'user');let t=document.createElement('div');t.className='msg bot';t.innerHTML='<div class="avatar">R</div><div class="bubble typing"><i></i><i></i><i></i></div>';chat.appendChild(t);chat.scrollTop=chat.scrollHeight;setTimeout(()=>{t.remove();addMessage(answer(q),'bot')},220)}
form.addEventListener('submit',e=>{e.preventDefault();let q=input.value;input.value='';send(q)});document.querySelectorAll('.suggestion').forEach(b=>b.onclick=()=>send(b.dataset.q));document.getElementById('clear').onclick=()=>{chat.innerHTML='';welcome()};function welcome(){addMessage('Hello. I’m RIVA, the real-estate assistant. How can I help?','bot')}welcome();
</script>
</body>
</html>
